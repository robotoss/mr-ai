[package]
name = "persistence"
version = "0.1.0"
edition = "2024"
license = "FSL-1.1"
description = "Postgres persistence (sqlx) for mr-ai-backend: pool, migrations, repos."

[lib]
name = "persistence"
path = "src/lib.rs"

[dependencies]
sqlx = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
async-trait = { workspace = true }
toml = { workspace = true }
domain = { workspace = true }

[dev-dependencies]
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["postgres"] }

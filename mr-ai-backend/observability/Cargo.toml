[package]
name = "observability"
version = "0.1.0"
edition = "2024"
license = "FSL-1.1"
description = "Telemetry + Prometheus metrics + (later) OTLP tracing + audit middleware for mr-ai-backend."

[dependencies]
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
thiserror = { workspace = true }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.16", default-features = false }

# OpenTelemetry stack (opt-in via OTEL_EXPORTER_OTLP_ENDPOINT at runtime).
# Versions pinned together — opentelemetry, the SDK, the OTLP exporter,
# and the `tracing` bridge must stay in lockstep or trait impls don't
# match.
opentelemetry = "0.31"
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.31", default-features = false, features = ["grpc-tonic", "trace"] }
tracing-opentelemetry = "0.32"
serde_json = { workspace = true }

# Audit middleware (sprint 3): axum middleware + sha2 for payload
# hashing. async-trait used by the `AuditPort` abstraction so
# observability doesn't depend on a concrete persistence type.
axum = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
metrics-util = "0.19"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }

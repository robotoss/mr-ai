[package]
name = "worker"
version = "0.1.0"
edition = "2024"
license = "FSL-1.1"
description = "Background job worker pool for mr-ai-backend (Postgres-backed queue)."

[lib]
name = "worker"
path = "src/lib.rs"

[dependencies]
async-trait = { workspace = true }
chrono = { workspace = true }
domain = { workspace = true }
futures = "0.3"
persistence = { workspace = true }
observability = { workspace = true }
project-code-store = { path = "../project_code_store" }
code-indexer = { path = "../code-indexer" }
git-context-engine = { path = "../git-context-engine" }
ai-llm-service = { path = "../ai-llm-service" }
ai-review-engine = { path = "../ai-review-engine" }
rag-base = { path = "../rag-base" }
qdrant-client = "1.15"
secrets = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }

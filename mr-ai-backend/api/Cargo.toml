[package]
name = "api"
version = "0.1.0"
edition = "2024"

[lib]
name = "api"
path = "src/lib.rs"

[dependencies]
tokio = { workspace = true }
axum   = { workspace = true }


ai-llm-service = { path = "../ai-llm-service" }
code-indexer = { path = "../code-indexer" }
services = { path = "../services" }
ai-review-engine = {path = "../ai-review-engine"}
project-code-store = { path = "../project_code_store" }
rag-base = { path = "../rag-base" }
git-context-engine = { path = "../git-context-engine" }

domain = { workspace = true }
secrets = { workspace = true }
persistence = { workspace = true }
worker = { workspace = true }
sqlx = { workspace = true }
sha2 = { workspace = true }
uuid = { workspace = true }

serde = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
colored = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
hmac = { workspace = true }
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["postgres"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
